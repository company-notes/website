name: Publish Company Notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # true per-file lastmod, never a build timestamp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test editorial metadata and home article placement
        run: python -m unittest discover -s tests -v
      - name: Test locale routing on pages and article deep links
        run: node tests/test_locale_redirect.cjs
      - name: Build site (3 languages)
        run: python scripts/build_site.py
      - name: Verify generated pages
        run: |
          test -f site/index.html
          test -f site/en/index.html
          test -f site/zh-hans/index.html
          test -f site/CNAME
      - name: Re-audit generated SEO metadata and sitemaps
        run: python scripts/check_seo.py
      - name: Configure GitHub Pages
        # Pages must already be enabled in Settings > Pages (Source: GitHub Actions).
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
