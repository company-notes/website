{% extends "base.html" %}
{% block extrahead %}
  {{ super() }}
  {% if page and page.meta and page.meta.status == "review" %}
  <meta name="robots" content="noindex, follow">
  {% endif %}
  <script>
    (function () {
      /* Apply the saved page colour before paint and localize direct content links. */
      var colors = {warm:1,white:1,cream:1,mist:1,sage:1,blush:1};
      var selected = null;
      try { selected = localStorage.getItem('company-notes:paper'); } catch (_) {}
      if (colors[selected]) document.documentElement.dataset.cnPaper = selected;

      var path = location.pathname;
      // A language prefix is an explicit visitor choice: never override it.
      if (/^\/(?:en|zh-hans)(?:\/|$)/.test(path)) return;
      // Only redirect actual content sections, not assets, sitemap or unknown paths.
      if (path !== '/' && !/^\/(?:blog|playbooks|toolkit|about)(?:\/|$)/.test(path)) return;

      var lang = null;
      try { lang = localStorage.getItem('company-notes:language'); } catch (_) {}
      if (lang !== 'zh-hant' && lang !== 'zh-hans' && lang !== 'en') {
        var languages = navigator.languages && navigator.languages.length
          ? navigator.languages : [navigator.language || ''];
        lang = 'en';
        for (var i = 0; i < languages.length; i++) {
          var browserLanguage = String(languages[i] || '').toLowerCase().replace(/_/g, '-');
          if (/^zh-(?:cn|sg|hans)(?:-|$)/.test(browserLanguage)) { lang = 'zh-hans'; break; }
          if (browserLanguage.indexOf('zh') === 0) { lang = 'zh-hant'; break; }
          if (browserLanguage.indexOf('en') === 0) { lang = 'en'; break; }
        }
      }
      if (lang === 'en' || lang === 'zh-hans') {
        location.replace('/' + lang + path + location.search + location.hash);
      }
    })();
  </script>
  {% if page %}
    {% set route = page.url.lstrip('/') %}
    <link rel="alternate" hreflang="zh-Hant" href="https://company-notes.com/{{ route }}">
    <link rel="alternate" hreflang="en" href="https://company-notes.com/en/{{ route }}">
    <link rel="alternate" hreflang="zh-Hans" href="https://company-notes.com/zh-hans/{{ route }}">
    <link rel="alternate" hreflang="x-default" href="https://company-notes.com/{{ route }}">
    <meta property="og:site_name" content="Company Notes">
    <meta property="og:type" content="{{ "article" if page.meta and page.meta.date else "website" }}">
  {% endif %}
{% endblock %}
