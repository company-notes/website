site_name: Company Notes
site_url: https://company-notes.com/
site_description: 一個人與 AI 團隊的真實公司營運實驗、架構和工具。
repo_url: https://github.com/company-notes/website
repo_name: company-notes/website
edit_uri: edit/main/content/zh-hant/
docs_dir: content/zh-hant
site_dir: site
copyright: "© Company Notes · Independent notes on operating with AI"
theme:
  name: material
  language: zh-Hant
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_url_format: "{slug}"
      blog_toc: true
      archive: true
      categories: true
      pagination: true
  - tags
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/site.css
extra_javascript:
  - javascripts/site.js
extra:
  locale: zh-hant
  alternate:
    - name: 繁體中文
      link: /
      lang: zh-Hant
    - name: English
      link: /en/
      lang: en
    - name: 简体中文
      link: /zh-hans/
      lang: zh-Hans
nav:
  - 首頁: index.md
  - 文章: blog/index.md
  - 方法論: playbooks/index.md
  - 工具箱: toolkit/index.md
  - 關於: about.md
